<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SL Billboard</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
}

/* ===== SL 2048 BILLBOARD FRAME ===== */
.stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vmin;
    height: 100vmin;
    transform: translate(-50%, -50%);
    max-width: 2048px;
    max-height: 2048px;
    overflow: hidden;
    background: black;
    box-shadow: 0 0 120px rgba(0,0,0,0.8);
}

/* ===== VIDEO ===== */
video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
}

/* ===== CINEMATIC DEPTH ===== */
.vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center,
        rgba(0,0,0,0.0) 40%,
        rgba(0,0,0,0.55) 100%);
    pointer-events: none;
}

/* ===== SOUND BUTTON ===== */
.sound-btn {
    position: absolute;
    bottom: 40px;
    right: 40px;
    z-index: 10;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.5);
    color: white;
    cursor: pointer;
    backdrop-filter: blur(8px);
}
</style>
</head>

<body>

<div class="stage">

    <!-- VIDEO -->
    <video id="vid" autoplay loop muted playsinline>
        <source src="https://files.catbox.moe/7z3pl0.mp4" type="video/mp4">
    </video>

    <!-- LIGHT VIGNETTE -->
    <div class="vignette"></div>

    <!-- SOUND BUTTON -->
    <button class="sound-btn" onclick="toggleSound()">
        🔊 Sound
    </button>

</div>

<script>
const vid = document.getElementById("vid");
const btn = document.querySelector(".sound-btn");

function tryPlay() {
    let p = vid.play();
    if (p !== undefined) {
        p.catch(() => setTimeout(tryPlay, 800));
    }
}

function toggleSound() {
    vid.muted = !vid.muted;

    if (!vid.muted) {
        vid.play();
        btn.innerHTML = "🔇 Mute";
    } else {
        btn.innerHTML = "🔊 Sound";
    }
}

tryPlay();

// SL safety loop
setInterval(() => {
    if (vid.paused) vid.play();
}, 2000);
</script>

</body>
</html>
