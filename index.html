<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cosy Isles Billboard</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
}

/* ====== 2048 SL BILLBOARD FRAME ====== */
.stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vmin;
    height: 100vmin;
    transform: translate(-50%, -50%);
    max-width: 2048px;
    max-height: 2048px;
    overflow: hidden;
    background: black;
    box-shadow: 0 0 120px rgba(0,0,0,0.8);
}

/* ====== VIDEO BACKGROUND ====== */
video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.95) contrast(1.1);
}

/* ====== DARK GRADIENT FOR LUXURY DEPTH ====== */
.vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center,
        rgba(0,0,0,0.0) 40%,
        rgba(0,0,0,0.55) 100%);
    pointer-events: none;
}

/* ====== GOLD LOGO ====== */
.logo {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 64px;
    letter-spacing: 10px;
    font-weight: 300;
    color: transparent;
    background: linear-gradient(
        120deg,
        #b08d2a,
        #f6e27a,
        #d4af37,
        #fff3b0,
        #b08d2a
    );
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;

    opacity: 0;
    animation: fadeIn 2.5s ease forwards, shimmer 4s infinite linear;
}

/* Subtitle */
.tagline {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.8);
    font-size: 16px;
    letter-spacing: 4px;
    opacity: 0;
    animation: fadeIn 2.5s ease forwards;
    animation-delay: 1s;
}

/* Fade-in */
@keyframes fadeIn {
    from { opacity: 0; transform: translate(-50%, -45%); }
    to { opacity: 1; transform: translate(-50%, -50%); }
}

/* Gold shimmer animation */
@keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}

/* Sound button */
.sound-btn {
    position: absolute;
    bottom: 40px;
    right: 40px;
    z-index: 10;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.5);
    color: white;
    cursor: pointer;
    backdrop-filter: blur(8px);
}
</style>
</head>

<body>

<div class="stage">

    <!-- VIDEO -->
    <video id="vid" autoplay loop muted playsinline>
        <source src="https://files.catbox.moe/7z3pl0.mp4" type="video/mp4">
    </video>

    <!-- VIGNETTE -->
    <div class="vignette"></div>

    <!-- GOLD LOGO -->
    <div class="logo">COSY ISLES</div>
    <div class="tagline">Luxury Island Living</div>

    <!-- SOUND BUTTON -->
    <button class="sound-btn" onclick="toggleSound()">
        🔊 Enable Sound
    </button>

</div>

<script>
const vid = document.getElementById("vid");
const btn = document.querySelector(".sound-btn");

function tryPlay() {
    let p = vid.play();
    if (p !== undefined) {
        p.catch(() => setTimeout(tryPlay, 800));
    }
}

function toggleSound() {
    vid.muted = !vid.muted;

    if (!vid.muted) {
        vid.play();
        btn.innerHTML = "🔇 Mute";
    } else {
        btn.innerHTML = "🔊 Enable Sound";
    }
}

tryPlay();

// SL stability safety loop
setInterval(() => {
    if (vid.paused) vid.play();
}, 2000);
</script>

</body>
</html>
